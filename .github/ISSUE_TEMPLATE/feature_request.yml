name: Feature Request
description: Suggest a new feature or improvement for Bureau
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Before submitting a feature request, please check if an ADR already covers this decision,
        and read the [implementation plan](implementation_plan.md) to see if it's already planned.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this feature solve? Who is affected?
      placeholder: "As a tenant with high task volume, I need to see per-model cost breakdown in real-time so I can optimize my model selection..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like. Be specific.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What alternatives did you consider? Why is your proposed solution better?
    validations:
      required: false

  - type: dropdown
    id: pillar
    attributes:
      label: Which pillar(s) does this affect?
      multiple: true
      options:
        - Pilar 1 — MCP Plugin (Claude Code / Gemini CLI)
        - Pilar 2 — SaaS API
        - Pilar 3 — Self-hosted (Docker / Kubernetes)
        - All pillars (@bureau/core)
        - Observability (Grafana / Prometheus)
        - Documentation only
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have checked that this feature doesn't violate any existing ADRs
          required: true
        - label: This feature has a concrete use case (not speculative)
          required: true
        - label: I am willing to contribute a PR for this feature
          required: false
