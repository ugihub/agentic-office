name: Bug Report
description: Report a bug in Bureau
labels: ["bug", "needs-triage"]
assignees: []
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as possible.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of Bureau is affected?
      options:
        - API Server (Fastify)
        - MCP Server (Claude Code / Gemini CLI plugin)
        - Workers (outbox publisher / decision timeout)
        - SDK (@bureau/sdk)
        - Core agents (CEO, HR, Finance, Compliance, Production, QA, Marketing)
        - LLM Providers (Claude, Gemini, etc.)
        - Semantic cache (Upstash Vector)
        - State machine (XState / AwaitingUserDecision)
        - Kubernetes / Helm chart
        - Observability (Grafana / Prometheus / Jaeger)
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: Clear and concise description of what the bug is.
      placeholder: "When I submit a task with prompt X, the Finance SSC returns InsufficientBudgetError even though the budget has $10 remaining..."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Minimal steps to reproduce the bug.
      placeholder: |
        1. POST /api/v1/tasks with body { "prompt": "..." }
        2. Wait for Producing stage
        3. Check MongoDB task_envelopes.budget.remaining
        4. See unexpected error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened? Include error messages, logs, or screenshots.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Bureau Version
      description: Output of `bureau-mcp --version` or npm package version
      placeholder: "0.1.0"
    validations:
      required: false

  - type: dropdown
    id: deployment
    attributes:
      label: Deployment Method
      options:
        - npx @bureau/mcp-server (MCP plugin)
        - Docker Compose (self-hosted)
        - Kubernetes + Helm
        - Bureau SaaS (api.bureau.id)
        - Development (local)
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Paste relevant log lines (Pino JSON output). Redact any secrets or personal data.
      render: json
    validations:
      required: false

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have removed any API keys or sensitive data from logs
          required: true
