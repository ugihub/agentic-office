name: CI

on:
  push:
    branches: [main, master, "feat/**", "fix/**", "chore/**"]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"

jobs:
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # `version:` removed — pnpm/action-setup@v4 conflicts with packageManager field.
        # It now reads pnpm@9.0.0 from package.json automatically.

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  typecheck:
    name: TypeScript Check
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

  lint:
    name: Lint
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

  build:
    name: Build
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (Turbo)
        run: pnpm run build

      - name: Cache turbo build
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-

  test:
    name: Unit Tests
    needs: setup
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      mongo:
        image: mongo:7.0
        ports:
          - 27017:27017
        env:
          MONGO_INITDB_ROOT_USERNAME: bureau
          MONGO_INITDB_ROOT_PASSWORD: bureau_secret
        options: >-
          --health-cmd "mongosh --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm run test
        env:
          MONGO_URI: mongodb://bureau:bureau_secret@localhost:27017/bureau_test
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test

  docker-smoke:
    name: Docker Build & Smoke
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Docker images
        run: docker compose build api-server workers

      - name: Generate dev JWT keys (api-server requires them in production)
        run: node scripts/gen-dev-jwt.mjs

      - name: Start services
        run: |
          # DEBUG: print effective env that api-server will see
          echo "--- .env (sanitized) ---"
          sed 's/=.*/=[REDACTED]/' .env 2>/dev/null | head -20
          echo "--- compose env preview ---"
          docker compose config api-server 2>&1 | sed -n '/environment:/,/^  [a-zA-Z]/p' | head -30
          echo "--- starting services ---"
          docker compose up -d mongo redis api-server workers
          sleep 10

      - name: Run smoke test (health only — no LLM key in CI)
        run: node scripts/smoke-docker.mjs
        env:
          BUREAU_API_URL: http://localhost:3001

      - name: Capture container logs (always — for debugging)
        if: always()
        run: |
          echo "--- bureau-api-server ---"
          docker compose logs --tail=100 --no-color api-server 2>&1 || true
          echo "--- bureau-workers ---"
          docker compose logs --tail=100 --no-color workers 2>&1 || true
          echo "--- bureau-mongo ---"
          docker compose logs --tail=50 --no-color mongo 2>&1 || true
          echo "--- bureau-redis ---"
          docker compose logs --tail=50 --no-color redis 2>&1 || true
