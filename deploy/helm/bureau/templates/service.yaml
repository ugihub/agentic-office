{{- if .Values.apiServer.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "bureau.fullname" . }}-api-server
  labels:
    {{- include "bureau.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
spec:
  type: {{ .Values.apiServer.service.type }}
  ports:
    - port: {{ .Values.apiServer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.apiServer.service.metricsPort }}
      targetPort: metrics
      protocol: TCP
      name: metrics
  selector:
    {{- include "bureau.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-server
{{- end }}
{{- if .Values.apiServer.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "bureau.fullname" . }}-api-server
  labels:
    {{- include "bureau.labels" . | nindent 4 }}
  {{- with .Values.apiServer.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.apiServer.ingress.className }}
  ingressClassName: {{ .Values.apiServer.ingress.className }}
  {{- end }}
  {{- if .Values.apiServer.ingress.tls }}
  tls:
    {{- toYaml .Values.apiServer.ingress.tls | nindent 4 }}
  {{- end }}
  rules:
    {{- range .Values.apiServer.ingress.hosts }}
    - host: {{ .host | quote }}
      http:
        paths:
          {{- range .paths }}
          - path: {{ .path }}
            pathType: {{ .pathType }}
            backend:
              service:
                name: {{ include "bureau.fullname" $ }}-api-server
                port:
                  name: http
          {{- end }}
    {{- end }}
{{- end }}
