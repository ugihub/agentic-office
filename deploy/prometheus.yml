global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: []
      # Alertmanager not required for MVP — alerts fire to Grafana only.
      # Wire up Alertmanager when on-call paging is needed.

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'bureau-api-server'
    static_configs:
      - targets: ['host.docker.internal:9100']
    metrics_path: '/metrics'

  - job_name: 'bureau-workers'
    static_configs:
      - targets: ['host.docker.internal:9102']
    metrics_path: '/metrics'

  - job_name: 'bureau-mcp-server'
    static_configs:
      - targets: ['host.docker.internal:9101']
    metrics_path: '/metrics'

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']

  - job_name: 'mongodb'
    static_configs:
      - targets: ['mongodb-exporter:9216']
    metrics_path: '/metrics'
